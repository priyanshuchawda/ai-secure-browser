<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>AI Secure Browser</title>
    <link rel="stylesheet" href="./electron/renderer/browser-ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="browser-header">
        <div class="address-bar">
          <input type="text" id="url-input" placeholder="Enter URL..." />
          <button id="go-btn">Go</button>
        </div>
        <div class="status-indicator" id="status">
          <span class="status-dot"></span>
          <span class="status-text">Protected</span>
        </div>
      </header>
      <main class="browser-content">
        <div class="welcome-message" id="welcome-panel">
          <h1>🛡️ AI Secure Browser</h1>
          <p>Protected by Gemini AI threat detection</p>
          <p class="status-info">Enter a URL above to scan and navigate securely</p>
        </div>
        
        <!-- Scan Results Panel (hidden by default) -->
        <div class="scan-results" id="scan-panel" style="display: none;">
          <div class="scan-header">
            <h2 id="scan-title">🔍 Scanning...</h2>
            <div class="scan-badge" id="scan-badge">Analyzing</div>
          </div>
          <div class="scan-url" id="scan-url"></div>
          
          <div class="scan-content">
            <div class="scan-score" id="scan-score">
              <div class="score-circle">
                <span class="score-value">--</span>
              </div>
              <div class="score-label">Safety Score</div>
            </div>
            
            <div class="scan-details">
              <div class="detail-item" id="threat-type">
                <strong>Status:</strong> <span>Analyzing...</span>
              </div>
              <div class="detail-item" id="analysis-method">
                <strong>Analysis:</strong> <span>AI Scan</span>
              </div>
              <div class="indicators-list" id="indicators-list">
                <!-- Indicators will be inserted here -->
              </div>
            </div>
          </div>
          
          <div class="scan-actions" id="scan-actions">
            <button class="btn-primary" id="proceed-btn" style="display: none;">✓ Proceed to Site</button>
            <button class="btn-secondary" id="cancel-btn">← Go Back</button>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./electron/renderer/browser-ui/main.ts"></script>
  </body>
</html>
